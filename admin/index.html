<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت پذیرندگان</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/css/peyda.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/css/kalameh.css"><style>:root{--red:#c61f32;--blue:#0877b3;--ink:#111923;--muted:#727c86;--bg:#f4f7fa;--line:#e7edf2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(198,31,50,.1),transparent 25%),radial-gradient(circle at 0 50%,rgba(8,119,179,.08),transparent 25%),var(--bg);color:var(--ink);font-family:Kalameh,sans-serif}.wrap{max-width:1280px;margin:auto;padding:22px}.glass{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(22px);box-shadow:0 20px 70px rgba(25,42,58,.09);border-radius:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:45px;height:45px;object-fit:contain}.brand b{font:950 16px Peyda}.brand span{display:block;color:#8b949d;font-size:9px;margin-top:2px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:13px;padding:11px 15px;font-size:10px;font-weight:900;cursor:pointer;background:#fff;border:1px solid var(--line)}.danger{color:#fff;background:var(--red);border-color:var(--red)}.login{max-width:430px;margin:9vh auto;padding:30px}.login h1{font:950 26px Peyda;margin:0 0 8px}.login p{font-size:10px;color:var(--muted);line-height:1.9}.input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;outline:none;margin-top:10px;font-size:11px}.error{display:none;color:var(--red);font-size:9px;margin-top:8px}.dashboard{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{padding:18px}.stat span{color:#8a939c;font-size:9px}.stat b{display:block;font:950 25px Peyda;margin-top:5px}.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.toolbar input,.toolbar select{height:43px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:10px}.toolbar input{flex:1;min-width:180px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:13px 10px;border-bottom:1px solid var(--line);font-size:9px;text-align:right;vertical-align:middle}.table th{color:#7b858f;background:rgba(246,249,251,.8);position:sticky;top:0}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef3f7;font-size:8px}.pill.new{color:#9b5b00;background:#fff6df}.pill.reviewing{color:#0b668d;background:#e8f5fb}.pill.approved{color:#177557;background:#e6f6ef}.pill.rejected{color:#a32c3d;background:#fdebed}.rowbtn{border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px 9px;font-size:8px;cursor:pointer}.drawer{position:fixed;inset:0;background:rgba(12,20,28,.38);backdrop-filter:blur(5px);display:none;align-items:stretch;justify-content:flex-start;z-index:99}.drawer.show{display:flex}.panel{width:min(680px,100%);height:100%;background:#f7f9fb;padding:22px;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.15)}.panelHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.panelHead h2{font:950 22px Peyda;margin:0}.close{border:0;background:#fff;width:38px;height:38px;border-radius:12px;cursor:pointer}.detail{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail .box{padding:12px 13px;border-radius:14px;background:#fff;border:1px solid var(--line)}.detail .box.full{grid-column:1/-1}.detail small{display:block;color:#8b949d;font-size:8px;margin-bottom:5px}.detail b{font-size:10px;line-height:1.8;white-space:pre-wrap;word-break:break-word}.statusActions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.note{width:100%;min-height:90px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;font-size:10px;resize:vertical}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.detail{grid-template-columns:1fr}.detail .box.full{grid-column:auto}}@media(max-width:480px){.wrap{padding:12px}.stats{gap:7px}.stat{padding:13px}.stat b{font-size:21px}.brand span{font-size:8px}.actions{flex-direction:column}.actions .btn{width:100%}}</style></head><body><div class="wrap"><div id="login" class="glass login"><h1>پنل مدیریت پذیرندگان</h1><p>دسترسی این بخش فقط برای کارشناس مجاز است. توکن ادمین از Environment Variable با نام <b>ADMIN_TOKEN</b> خوانده می‌شود.</p><input id="token" class="input" type="password" placeholder="توکن مدیریت"><button id="loginBtn" class="btn danger" style="width:100%;margin-top:10px">ورود به پنل</button><div id="loginErr" class="error">توکن نادرست است.</div></div><section id="dashboard" class="dashboard"><div class="top"><div class="brand"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Rar_bgardeshgari.svg" alt="بانک گردشگری"><div><b>مدیریت پذیرندگان</b><span>ثبت و بررسی درخواست‌های وب</span></div></div><div class="actions"><button id="refresh" class="btn">به‌روزرسانی</button><button id="logout" class="btn">خروج</button></div></div><div class="stats"><div class="glass stat"><span>کل درخواست‌ها</span><b id="sAll">۰</b></div><div class="glass stat"><span>جدید</span><b id="sNew">۰</b></div><div class="glass stat"><span>در حال بررسی</span><b id="sReview">۰</b></div><div class="glass stat"><span>تأییدشده</span><b id="sApproved">۰</b></div></div><div class="glass" style="padding:12px"><div class="toolbar"><input id="search" placeholder="جستجو بر اساس نام فروشگاه، موبایل یا شناسه..."><select id="status"><option value="">همه وضعیت‌ها</option><option value="new">جدید</option><option value="reviewing">در حال بررسی</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option><option value="archived">بایگانی</option></select><button id="export" class="btn">خروجی CSV</button></div><div id="table" class="table"></div></div></section></div><div id="drawer" class="drawer"><aside class="panel"><div class="panelHead"><div><h2 id="dTitle">جزئیات درخواست</h2><div id="dSub" style="font-size:8px;color:#8b949d;margin-top:4px"></div></div><button id="close" class="close">×</button></div><div class="statusActions"><button class="btn" data-status="new">جدید</button><button class="btn" data-status="reviewing">در حال بررسی</button><button class="btn" data-status="approved">تأیید</button><button class="btn" data-status="rejected">رد</button><button class="btn" data-status="archived">بایگانی</button></div><textarea id="adminNote" class="note" placeholder="یادداشت کارشناس..."></textarea><button id="saveNote" class="btn danger" style="width:100%;margin-top:8px">ذخیره وضعیت و یادداشت</button><div id="detail" class="detail"></div></aside></div><script>let token=sessionStorage.getItem('q_admin_token')||'';let records=[];let selected=null;const $=id=>document.getElementById(id);function fmt(v){return v===undefined||v===null||v===''?'—':String(v)}function fa(n){return new Intl.NumberFormat('fa-IR').format(n)}function authHeaders(){return {Authorization:'Bearer '+token,'Content-Type':'application/json'}}async function api(url,options={}){const r=await fetch(url,{...options,headers:{...authHeaders(),...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('401');if(!r.ok)throw new Error(d.message||'خطا');return d}function showDashboard(){ $('login').style.display='none';$('dashboard').style.display='block';load()}async function load(){try{const d=await api('/api/submissions?limit=250');records=d.records||[];render()}catch(e){if(e.message==='401'){sessionStorage.removeItem('q_admin_token');$('dashboard').style.display='none';$('login').style.display='block';$('loginErr').style.display='block'}else alert(e.message)}}function render(){const q=$('search').value.trim().toLowerCase();const st=$('status').value;const list=records.filter(r=>{const t=JSON.stringify(r).toLowerCase();return(!q||t.includes(q))&&(!st||r.status===st)});$('sAll').textContent=fa(records.length);$('sNew').textContent=fa(records.filter(x=>x.status==='new').length);$('sReview').textContent=fa(records.filter(x=>x.status==='reviewing').length);$('sApproved').textContent=fa(records.filter(x=>x.status==='approved').length);if(!list.length){$('table').innerHTML='<div style="padding:35px;text-align:center;color:#8b949d;font-size:10px">درخواستی پیدا نشد.</div>';return}$('table').innerHTML='<table><thead><tr><th>شناسه</th><th>فروشگاه</th><th>مدیر/پذیرنده</th><th>موبایل</th><th>شهر</th><th>وضعیت</th><th></th></tr></thead><tbody>'+list.map(r=>{const d=r.data||{};return `<tr><td>${fmt(r.id)}</td><td>${fmt(d.storeName)}</td><td>${fmt(d.fullName)}</td><td dir="ltr">${fmt(d.mobile)}</td><td>${fmt(d.cityName)}</td><td><span class="pill ${fmt(r.status)}">${fmt(r.status)}</span></td><td><button class="rowbtn" onclick="openDetail('${encodeURIComponent(r.id)}')">مشاهده</button></td></tr>`}).join('')+'</tbody></table>'}window.openDetail=function(enc){const id=decodeURIComponent(enc);selected=records.find(r=>r.id===id);if(!selected)return;const d=selected.data||{};$('dTitle').textContent=d.storeName||'درخواست پذیرنده';$('dSub').textContent=`${selected.id} • ${new Date(selected.createdAt).toLocaleString('fa-IR')}`;$('adminNote').value=selected.adminNote||'';const labels={storeName:'نام فروشگاه',profession:'صنف',accountNumber:'شماره حساب',cardNumber:'شماره کارت',iban:'شبا',bankName:'نام بانک',fullName:'نام و نام خانوادگی/مدیرعامل',nationalId:'کد ملی',identityNumber:'شماره شناسنامه',fatherName:'نام پدر',birthDate:'تاریخ تولد',landline:'تلفن',mobile:'موبایل',email:'ایمیل',provinceName:'استان',cityName:'شهر',address:'آدرس محل کسب',postalCode:'کد پستی',taxCode:'کد مالیاتی',residenceAddress:'نشانی محل سکونت',residencePostal:'کد پستی سکونت',ownership:'نوع مالکیت',leaseFrom:'شروع اجاره',leaseTo:'پایان اجاره',licenseStatus:'جواز کسب',communication:'بستر ارتباطی',storeCashbox:'صندوق فروشگاهی',scale:'ترازو',activityProof:'مدرک فعالیت',otherPSP:'کارتخوان سایر PSPها',description:'توضیحات',witness1Name:'شاهد اول',witness1Mobile:'موبایل شاهد اول',witness1Address:'نشانی شاهد اول',witness2Name:'شاهد دوم',witness2Mobile:'موبایل شاهد دوم',witness2Address:'نشانی شاهد دوم'};$('detail').innerHTML=Object.entries(labels).filter(([k])=>d[k]!==undefined).map(([k,l])=>`<div class="box ${['address','residenceAddress','description','witness1Address','witness2Address'].includes(k)?'full':''}"><small>${l}</small><b>${fmt(d[k])}</b></div>`).join('')+`<div class="box full"><small>اعتبارسنجی بیرونی</small><b>${fmt(JSON.stringify(selected.verification||{},null,2))}</b></div>`;$('drawer').classList.add('show')};async function updateStatus(status){if(!selected)return;const d=await api('/api/submissions',{method:'PATCH',body:JSON.stringify({id:selected.id,status,note:$('adminNote').value})});selected=d.record;records=records.map(r=>r.id===selected.id?selected:r);render();openDetail(encodeURIComponent(selected.id))} $('loginBtn').onclick=async()=>{token=$('token').value.trim();if(!token)return;sessionStorage.setItem('q_admin_token',token);try{await api('/api/submissions?limit=1');$('loginErr').style.display='none';showDashboard()}catch(e){sessionStorage.removeItem('q_admin_token');$('loginErr').style.display='block'}};$('refresh').onclick=load;$('logout').onclick=()=>{sessionStorage.removeItem('q_admin_token');location.reload()};$('search').oninput=render;$('status').onchange=render;$('close').onclick=()=>$('drawer').classList.remove('show');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('show')};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.status));$('saveNote').onclick=()=>{if(selected)updateStatus(selected.status)};$('export').onclick=()=>{const rows=[['id','createdAt','status','storeName','fullName','mobile','province','city','nationalId','postalCode'],...records.map(r=>{const d=r.data||{};return[r.id,r.createdAt,r.status,d.storeName,d.fullName,d.mobile,d.provinceName,d.cityName,d.nationalId,d.postalCode]})];const csv='\ufeff'+rows.map(row=>row.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='qualification-submissions.csv';a.click()};if(token)showDashboard();</script></body></html>
